name: Quant VN30 Daily Bot

on:
  schedule:
    - cron: '15 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
          pip install pandas "numpy<2.0" yfinance scikit-learn requests plotly xgboost

      - name: Run Quant Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_bot.py

      - name: Commit and Push Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f trading_log.csv ]; then
            git add trading_log.csv
            if git diff --staged --quiet; then
              echo "Khong co lenh moi, bo qua commit."
            else
              git commit -m "Auto-update: Luu lich su phim lenh [skip ci]"
              git push
            fi
          else
            echo "Chua co file trading_log.csv duoc tao."
          fi
