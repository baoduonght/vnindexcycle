name: HỆ THỐNG QUANT VN30

on:
  schedule:
    # Chạy toàn bộ chu trình (Train AI + Quét 2 chế độ) vào 15:00 Chủ nhật hằng tuần (08:00 UTC)
    - cron: '0 8 * * 0'

  workflow_dispatch:
    inputs:
      entry_mode:
        description: 'Chế độ chạy bot'
        type: choice
        default: balanced
        options:
          - balanced
          - profit_guard
          - baseline
          - quality
          - index_trend
      dual_mode:
        description: 'Chạy song song cả balanced và profit_guard (gửi 2 tin nhắn Telegram)'
        type: boolean
        default: true
      retrain:
        description: 'Huấn luyện lại model trước khi chạy (không bật khi so sánh các chế độ)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  quant-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy mã nguồn và Dữ liệu từ Repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Cài đặt thư viện tài chính & AI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-winrate.txt
          pip install yfinance plotly python-dotenv pandas-datareader
          pip install --extra-index-url https://vnstocks.com/api/packages "vnstock-oapi>=0.1.0,<1" || echo "Không cài được vnstock-oapi, dùng fallback direct API"
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Kiểm tra logic trước khi chạy
        run: python run_tests.py

      # ==========================================
      # NHÁNH 1: CẬP NHẬT VĨ MÔ & TRAIN LẠI AI (15:00 CHỦ NHẬT HOẶC TÍCH RETRAIN)
      # ==========================================
      - name: 📡 Cập nhật Cơ sở Dữ liệu Vĩ mô (macro_database.py)
        if: github.event.schedule == '0 2 * * 6' || github.event.schedule == '0 8 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.retrain)
        env:
          DNSE_API_KEY: ${{ secrets.DNSE_API_KEY }}
          DNSE_API_SECRET: ${{ secrets.DNSE_API_SECRET }}
          VNSTOCK_OAPI_SESSION_BACKEND: file
        run: python macro_database.py

      - name: 🧠 Mở Lò Luyện Đan (train_bot.py)
        if: github.event.schedule == '0 2 * * 6' || github.event.schedule == '0 8 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.retrain)
        env:
          DNSE_API_KEY: ${{ secrets.DNSE_API_KEY }}
          DNSE_API_SECRET: ${{ secrets.DNSE_API_SECRET }}
          VNSTOCK_OAPI_SESSION_BACKEND: file
        run: python train_bot.py

      - name: 💾 Lưu Não Bộ Mới & Dữ liệu Vĩ mô Lên Github
        if: github.event.schedule == '0 2 * * 6' || github.event.schedule == '0 8 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.retrain)
        run: |
          git config --global user.name "Quant AutoBot"
          git config --global user.email "bot@quant.com"
          git add models/xgboost_*.json data/markets_database*.csv data/vn_markets_database*.csv data/global_markets_database*.csv
          git commit -m "🤖 [Auto-Update] Đã đúc xong não bộ AI Walk-Forward & Cập nhật Vĩ mô tuần mới" || echo "Không có sự thay đổi để commit"
          git push

      # ==========================================
      # NHÁNH 2: NGẮM BẮN & BÁO CÁO (1 STEP DUY NHẤT ĐỂ PASS WORKFLOW CONTRACT)
      # ==========================================
      - name: 🎯 Bắn tín hiệu Telegram (quant_bot.py)
        if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          ENTRY_MODE: ${{ inputs.entry_mode || 'balanced' }}
          RUN_EXPECTED_ENTRY_MODE: ${{ inputs.entry_mode || 'balanced' }}
          DUAL_MODE: ${{ github.event_name == 'schedule' && 'true' || inputs.dual_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DNSE_API_KEY: ${{ secrets.DNSE_API_KEY }}
          DNSE_API_SECRET: ${{ secrets.DNSE_API_SECRET }}
          VNSTOCK_OAPI_SESSION_BACKEND: file
        run: python quant_bot.py

      - name: 📊 Cập nhật Sổ Kế Toán outputs/*.csv lên Github (cho Power BI)
        if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "Quant AutoBot"
          git config --global user.email "bot@quant.com"
          git add outputs/trading_log.csv outputs/daily_nav.csv outputs/completed_trades.csv outputs/signal_diagnostics.csv outputs/run_manifest.json
          if [ -d "outputs/balanced" ]; then git add outputs/balanced/*.csv outputs/balanced/*.json; fi
          git commit -m "📊 [Auto-Update] Cập nhật sổ kế toán giao dịch & chu kỳ vị thế cho Power BI" || echo "Không có giao dịch mới để commit"
          git push