name: Quant VN30 Daily Bot

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

# Cấp quyền cho bot tự động ghi đè file lên repo
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          pip install git+https://github.com/rongardF/tvdatafeed.git
          pip install pandas "numpy<2.0" yfinance scikit-learn requests

      - name: Thực thi Bot Quét Tín hiệu
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python quant_bot.py

      # Lệnh lưu và đẩy file trading_log.csv lên GitHub
      - name: Lưu Nhật ký Giao dịch (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_log.csv
          git commit -m "Auto-update: Lưu lịch sử phím lệnh [skip ci]" || echo "Không có mã nào đạt điểm nổ để lưu"
          git push
