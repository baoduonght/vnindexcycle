name: HỆ THỐNG QUANT VN30 - BẢN TIN CHIẾN LƯỢC THỨ 7

on:
  schedule:
    # 🎯 Chạy tự động vào đúng 09:00 sáng Thứ 7 hàng tuần (Giờ VN: UTC+7 -> Giờ UTC là 02:00)
    - cron: '0 2 * * 6'
    
  # Cho phép bấm nút "Run workflow" bằng tay trên Github để test bất cứ lúc nào
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  weekly-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Cài đặt thư viện tài chính & AI
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests xgboost scikit-learn beautifulsoup4 pandas-datareader
          pip install git+https://github.com/rongardF/tvdatafeed.git

      # BƯỚC 1: CẬP NHẬT TOÀN BỘ VĨ MÔ TUẦN MỚI
      - name: 🌍 1. Quét dữ liệu Vĩ mô & VNINDEX (macro_database.py)
        run: python macro_database.py

      # BƯỚC 2: MỞ LÒ LUYỆN ĐAN THỨ 7
      - name: 🧠 2. Đúc Não Bộ AI Mới (train_bot.py)
        run: python train_bot.py

      # BƯỚC 3: QUÉT CHIẾN LƯỢC TUẦN & BẮN TELEGRAM
      - name: 🎯 3. Quét Tín Hiệu & Gửi Báo Cáo Tuần (quant_bot.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_bot.py

      # BƯỚC 4: TỰ ĐỘNG LƯU TOÀN BỘ KẾT QUẢ LÊN GITHUB CHO POWER BI
      - name: 💾 4. Lưu Não Bộ, Dữ Liệu & Sổ Lệnh Lên Github
        run: |
          git config --global user.name "Quant AutoBot"
          git config --global user.email "bot@quant.com"
          git add markets_database10years.csv markets_database_now.csv vn_markets_database10years.csv global_markets_database10years.csv xgboost_ultimate.json trading_log.csv
          git commit -m "🤖 [Auto-Update Thứ 7] Cập nhật Vĩ mô, Não bộ AI & Sổ lệnh tuần mới [skip ci]" || echo "Không có thay đổi để commit"
          git push
