name: HỆ THỐNG QUANT VN30

on:
  schedule:
    # 🎯 NHÁNH THỰC CHIẾN: Chạy quant_bot.py vào 15:15 chiều Thứ 2 đến Thứ 6
    # Giờ VN (UTC+7) là 15:15 -> Giờ UTC là 08:15
    - cron: '15 8 * * 1-5'
    
    # 🧠 NHÁNH HỌC TẬP: Chạy train_bot.py vào 09:00 sáng Thứ 7
    # Giờ VN (UTC+7) là 09:00 -> Giờ UTC là 02:00
    - cron: '0 2 * * 6'
    
  # Cho phép bác bấm nút "Run workflow" bằng tay trên Github để test thử bot Telegram
  workflow_dispatch:

permissions:
  # Cấp quyền tối cao để Bot tự động lưu file não bộ (.json) đè lên Github
  contents: write 

jobs:
  quant-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy mã nguồn và Dữ liệu từ Repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ⚙️ Cài đặt thư viện tài chính & AI
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests tvDatafeed xgboost scikit-learn plotly
          pip install git+https://github.com/rongardF/tvdatafeed.git
      # ==========================================
      # NHÁNH 1: LUYỆN ĐAN & LƯU BỘ NHỚ (CHỈ CHẠY THỨ 7)
      # ==========================================
      - name: 🧠 Mở Lò Luyện Đan (train_bot.py)
        if: github.event.schedule == '0 2 * * 6'
        run: python train_bot.py

      - name: 💾 Lưu Não Bộ Mới Lên Github (.json)
        if: github.event.schedule == '0 2 * * 6'
        run: |
          git config --global user.name "Quant AutoBot"
          git config --global user.email "bot@quant.com"
          git add xgboost_ultimate.json
          git commit -m "🤖 [Auto-Update] Đã đúc xong não bộ AI tuần mới" || echo "Không có sự thay đổi để commit"
          git push

      # ==========================================
      # NHÁNH 2: NGẮM BẮN & BÁO CÁO (CHẠY T2-T6 HOẶC BẤM TEST TAY)
      # ==========================================
      - name: 🎯 Bắn tín hiệu Telegram (quant_bot.py)
        if: github.event.schedule == '15 8 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_bot.py
