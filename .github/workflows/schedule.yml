name: Daily Macro Tracker

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cài đặt các thư viện cần thiết
        run: |
          pip install pandas yfinance requests beautifulsoup4 pandas-datareader
          pip install git+https://github.com/rongardF/tvdatafeed.git
          pip install vnstock==0.2.8.post1

      - name: Chạy Bot thu thập dữ liệu
        run: python macro_database.py

      - name: Lưu và cập nhật file CSV lên GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update: Macro data [skip ci]" || exit 0
          git push
