name: Daily Macro Tracker

on:
  schedule:
    # 🎯 Chạy lúc 07:30 SÁNG hàng ngày từ Thứ 2 đến Thứ 6 (Giờ VN: UTC+7 -> Giờ UTC là 00:30)
    # Lúc này: Sàn Mỹ vừa chốt số đêm qua (05:00 sáng) + Sàn VN đã có đủ dữ liệu ngày hôm trước
    - cron: '30 0 * * 1-5'
    
  workflow_dispatch: 

jobs:
  run-daily-macro:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 Lấy mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Cài đặt các thư viện
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests beautifulsoup4 pandas-datareader
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: 🌍 Chạy Bot cào dữ liệu vĩ mô hàng ngày
        run: python macro_database.py

      - name: 💾 Lưu và cập nhật file CSV lên GitHub cho Power BI
        run: |
          git config --global user.name "Macro AutoBot"
          git config --global user.email "bot@macro.com"
          git add markets_database10years.csv markets_database_now.csv vn_markets_database10years.csv global_markets_database10years.csv
          git commit -m "📊 [Daily-Macro] Cập nhật số liệu Vĩ mô sáng sớm [skip ci]" || echo "Không có thay đổi để commit"
          git push
